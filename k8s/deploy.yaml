apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ppteste
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-ppteste

  template:
    metadata:
      labels:
        app: api-ppteste

    spec:
      containers:
        - name: api-ppteste
          image: ${DOCKER_IMAGE}:${GITHUB_SHA} 
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080

          livenessProbe:
            httpGet:
              path: /health
              port: 8080

